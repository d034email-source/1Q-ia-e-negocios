<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Comunicação, Mídia e Vendas</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mut:#5d6679;--pri:#3b5bdb;--ok:#2b8a3e;--okb:#ebfbee;--no:#c92a2a;--nob:#fff0f0;--bd:#dde2ee;--hl:#fff8db}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:1.5rem;margin:.3em 0}h2{font-size:1.1rem;margin:1em 0 .5em}
.mut{color:var(--mut)}.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:10px 14px;color:var(--ink)}
button.on,.go{background:var(--pri);color:#fff;border-color:var(--pri)}.go{font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tag{font-size:.75rem;padding:2px 10px;border-radius:99px;background:#e7ecff;color:var(--pri);font-weight:600}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--hl);border-left:4px solid #f0b400}
.big{font-size:2.6rem;font-weight:700}hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
</style></head><body><div class="w" id="app"></div>
<script>
const N={f:'Fácil',m:'Médio',d:'Difícil'};
const Q=[
["f","O que é um canal de mídia, segundo a Aula 6?","O caminho físico ou digital que leva a mensagem ao consumidor","O valor reservado para veicular os anúncios da campanha","O time de vendedores que visita os clientes da empresa","O público para o qual a mensagem da marca é criada","Canal é o caminho, físico ou digital, que leva a mensagem da empresa até o consumidor."],
["f","Quais são as três variáveis estruturais de entrega de um canal (Kotler)?","Alcance, Frequência e Impacto","Alcance, Impacto e Conversão","Frequência, Custo e Prestígio","Impacto, CPM e Frequência","A eficácia do canal depende da relação entre Alcance (Reach), Frequência e Impacto."],
["f","O Alcance mede o número de pessoas…","expostas ao anúncio pelo menos uma vez no período","expostas ao anúncio em média a cada semana","que clicaram no anúncio e chegaram ao site","que compraram depois de ver o anúncio","Alcance = pessoas (ou lares/contas únicas) expostas pelo menos uma vez em um período."],
["f","O que o CPM indica?","Quanto custa para atingir 1.000 pessoas naquele canal","Quanto custa cada clique em um anúncio digital","Quantas vezes o lar médio viu a mensagem","Quanto custa fechar 1.000 vendas no varejo","CPM = Custo por Mil: o custo para atingir mil pessoas no canal."],
["f","Na classificação de Kotler, quem são os Canais de Defensores (Advocacy)?","Vendedores da própria empresa que contatam os compradores","Amigos, vizinhos e familiares que indicam a marca","Especialistas independentes que fazem declarações","Clientes que deixam avaliações em sites públicos","Defensores = vendedores da própria empresa (ex.: consultores da Cacau Show na loja)."],
["f","Um anúncio foi visto por 320.000 das 1.000.000 de pessoas das classes AB de Fortaleza. Qual o alcance?","32%","3,2%","320%","68%","320.000 ÷ 1.000.000 × 100 = 32%."],
["f","O que é Gestão de Vendas, segundo a Aula 8?","Planejar, direcionar, controlar e liderar as atividades de venda","Escolher os canais de mídia mais baratos para a campanha","Persuadir o cliente no momento exato do fechamento","Recrutar e remunerar os vendedores da empresa","É o processo de planejar, direcionar, controlar e liderar as atividades de venda."],
["f","Quais canais são ideais para o topo do funil (lançamento e consciência de marca)?","TV, mídia exterior (OOH) e grandes portais digitais","Links patrocinados e WhatsApp corporativo","Blogs, reviews e e-mail marketing","Venda consultiva direta com o vendedor","Topo do funil prioriza Alcance: TV, OOH e grandes portais."],
["f","O que significa o termo Phygital?","Fusão entre o mundo físico e o digital","Fusão entre canais pessoais e não pessoais","Fusão entre vendas B2B e vendas B2C","Fusão entre mídia de massa e CRM","Phygital = físico + digital: experiência fluida e contínua."],
["f","O que acontece na etapa de Pós-venda?","Gestão do relacionamento para fidelização e recompra","Esclarecimento de dúvidas e mitigação de resistências","Conversão e assinatura do contrato com o cliente","Pesquisa inicial e primeiro contato com o cliente","Pós-venda = relacionamento para fidelizar e gerar recompra."],
["f","Qual é o perfil do mercado B2C?","Decisões ágeis, apelos emocionais e exigência de conveniência","Ciclos de decisão longos e vários tomadores de decisão","Motivadores essencialmente racionais e corporativos","Vendas estruturadas entre empresas parceiras","B2C = consumidor final, decisão rápida, forte emoção e conveniência (Las Casas)."],
["f","Segundo a Aula 7, a escolha do canal deve se basear em…","critérios técnicos objetivos","o gosto pessoal do gestor","a mídia que os concorrentes usam","o canal com menor preço absoluto","A escolha nunca é pelo gosto do gestor, e sim por critérios técnicos objetivos."],
["f","Qual característica define os Canais Não Pessoais (massa)?","Grande alcance e alto poder de construção de marca","Alta personalização e feedback imediato","Contato direto, cara a cara, com o comprador","Mensagem ajustada a cada cliente individual","Massa: grande alcance, menor customização e forte construção de marca."],
["f","No funil integrado, quem atua no topo (atração)?","A Gestão de Mídia","A Comunicação Integrada","A Gestão de Vendas","O time de pós-venda","Topo = Mídia (atrair tráfego e gerar leads qualificados)."],
["f","O que compõe o pilar Gestão de Pessoas (Liderança)?","Recrutamento, treinamento, motivação e compensação","Metas, previsão de vendas e canais de distribuição","Estrutura da equipe, territórios e rotinas","Prospecção, apresentação e fechamento das vendas","O pilar trata de quem executa a estratégia: recrutar, treinar, motivar e remunerar."],
["f","Qual característica define os Canais Pessoais?","Alta personalização e feedback imediato","Grande alcance com baixa customização","Alto poder de construção de marca em massa","Mensagem única sem interação direta","Pessoais envolvem duas ou mais pessoas interagindo diretamente."],
["m","Pessoas impactadas: 6 de 10. Elas viram o anúncio 2, 2, 1, 2, 2 e 3 vezes. Qual a frequência média?","2","1,2","6","12","Soma = 12; 12 ÷ 6 pessoas impactadas = 2."],
["m","Um anúncio de rádio vai ao ar 7 vezes e é ouvido, a cada vez, por 200 mil pessoas. Quantos impactos?","1.400.000","207.000","200.000","14.000.000","7 × 200 mil = 1.400.000 impactos."],
["m","A Veja tem cerca de 2.000.000 de leitores e a página custa R$ 150.000. Qual o CPM?","R$ 75,00","R$ 7,50","R$ 300,00","R$ 0,75","150.000 × 1.000 ÷ 2.000.000 = R$ 75,00."],
["m","Entre as revistas do exercício, qual é a mais rentável (menor CPM)?","Claudia, com CPM de R$ 81,81","Caras, com CPM de R$ 83,96","Nova, com CPM de R$ 98,60","Marie Claire, com CPM de R$ 109,89","Claudia é a mais barata para atingir 1.000 pessoas; Marie Claire é a mais cara."],
["m","No exercício de Instagram, qual formato entrega o menor custo por mil impressões?","Reels, com CPM de R$ 8,00","Stories, com CPM de R$ 8,06","Carrossel, com CPM de R$ 8,94","Empate entre Reels e Stories","Reels (8,00) < Stories (8,06) < Carrossel (8,94): Reels é o mais rentável."],
["m","De 10 pessoas, 6 viram o anúncio (algumas mais de uma vez). Qual o alcance?","60%","12%","120%","40%","Alcance conta quem viu pelo menos 1 vez: 6 ÷ 10 × 100 = 60%, sem somar repetições."],
["m","Quando a Frequência é indicada?","Quando há forte resistência do consumidor ou história complexa","Quando se lança um produto em um mercado amplo","Quando o objetivo é resposta direta e imediata","Quando a verba é limitada e o público é local","Frequência serve para resistência ou histórias complexas; Alcance serve para lançamentos."],
["m","Um anúncio de moda rende mais na Vogue do que na Fortune. Qual variável explica isso?","Impacto","Alcance","Frequência","CPM","Impacto é o valor qualitativo de uma exposição por meio de um veículo."],
["m","Qual exemplo representa um Canal de Especialistas?","Médico influenciador recomendando um protetor solar no Instagram","Grupo de amigos indicando um restaurante no WhatsApp","Consultor da Oracle apresentando o software à diretoria","Cliente avaliando a loja no Google Avaliações","Especialistas são independentes e fazem declarações aos compradores-alvo."],
["m","O que são as Atmosferas, entre os canais não pessoais?","Ambientes projetados para reforçar a inclinação de compra","Ocorrências planejadas, como feiras e patrocínios","Veículos de exibição, como outdoors e cartazes","Contatos diretos por telefone, e-mail ou chat","Atmosferas: design de lojas físicas e interfaces de e-commerce, por exemplo."],
["m","Como agem as empresas com verbas limitadas, segundo a Aula 7?","Abrem mão do alcance total e focam em hipersegmentação ou mídias locais","Combinam mídia de massa off-line com digital de alta frequência","Priorizam TV aberta para garantir o maior alcance possível","Concentram a verba em eventos e grandes patrocínios","Verba limitada obriga a hipersegmentação digital ou mídias locais; verba robusta permite o efeito multiplicador."],
["m","Quais canais são ideais para a base do funil (resposta direta e vendas)?","Mídia de performance (CPC), links patrocinados e WhatsApp corporativo","TV, mídia exterior e grandes portais digitais","Influenciadores técnicos, reviews e blogs","Eventos, patrocínios e feiras de lançamento","Base do funil exige canais de alta conversão."],
["m","Qual canal combina com produtos de alta complexidade técnica, como serviços financeiros e B2B?","Canais escritos, mídias de prestígio ou defensores (venda consultiva)","Vídeos curtos de impacto visual, como Reels","Outdoors em vias de grande circulação","Atmosferas imersivas em lojas de varejo","Complexidade técnica pede canais escritos, mídia de prestígio ou venda consultiva direta."],
["m","Qual formato combina com produtos de forte apelo visual, como moda, carros e imóveis?","Vídeo (Reels, comerciais de TV) ou atmosferas imersivas","Canais escritos e relatórios técnicos","Links patrocinados com texto curto","E-mail marketing com catálogo em texto","Necessidade de demonstração pede vídeo ou atmosferas imersivas."],
["m","No funil integrado, quem nutre o cliente com conteúdo e relacionamento (meio)?","A Comunicação Integrada","A Gestão de Mídia","A Gestão de Vendas","A equipe de pós-venda","Meio = Comunicação Integrada: gera relacionamento e confiança."],
["m","Qual é a vantagem principal da estrutura por Linha de Produtos?","Domínio técnico profundo e venda consultiva de alto valor","Proximidade física e facilidade de atendimento local","Atendimento sob medida para cada perfil de cliente","Eliminação de barreiras geográficas e da ociosidade","Equipes por especialidade dominam categorias complexas."],
["m","O tempo de resposta ao cliente digital é uma métrica de…","esforço","resultado","impacto","faturamento","Métricas de esforço medem o volume operacional e o comportamento do vendedor."],
["m","Qual par traz apenas métricas de resultado?","Faturamento omnichannel e taxa de conversão dos links","Mensagens ativas no WhatsApp e taxa de conversão","Tempo de resposta e ticket médio","Mensagens ativas e tempo de resposta ao cliente","Resultado = faturamento, conversão e ticket médio; mensagens e tempo de resposta são esforço."],
["m","Segundo a Aula 7, o que a sinergia de canais pede de um outdoor ou anúncio impresso?","Conter um QR Code ou ponto de contato digital imediato","Repetir a mensagem na TV no mesmo horário","Trazer o preço e o endereço da loja mais próxima","Ser veiculado apenas em regiões de alta renda","Sinergia: o anúncio físico deve levar ao digital de forma imediata."],
["d","A quantidade de inserções em que uma peça foi ou será veiculada é a…","Frequência","Frequência média","Alcance","Impacto","Frequência = nº de inserções; Frequência média = média de exposições por pessoa impactada."],
["d","Para calcular a frequência média, a soma das frequências é dividida por…","pessoas impactadas","universo pesquisado","total de inserções","número de veículos usados","Divide-se pelas pessoas impactadas (média aritmética), não pelo universo."],
["d","Um veículo de massa tem CPM baixíssimo, mas 90% da audiência não tem perfil nem renda para comprar. O que concluir?","Foi desperdício; priorize canais de alta afinidade, mesmo mais caros","Foi eficiente, pois o CPM baixo garante o melhor custo-benefício","Se justifica pelo alcance, que compensa o perfil da audiência","É válido se a frequência subir na mesma mídia","Qualidade do público vale mais que CPM baixo: priorize alta afinidade e concentração do público-alvo."],
["d","Lançamento de um celular dobrável caro: um anúncio único na TV aberta ou 10 inserções com influenciador de nicho. Qual a melhor?","Influenciador de nicho, pela alta frequência e confiança","Anúncio único na final do futebol, pelo grande alcance","Anúncio único na final da novela, pelo prestígio","As duas têm o mesmo efeito para um produto caro","Produto caro e novo gera desconfiança: exige repetição e explicação de alguém confiável."],
["d","Avaliações de clientes reais no TripAdvisor e no Google pertencem a qual subcanal?","Canais Sociais","Canais de Especialistas","Canais de Defensores","Atmosferas","Sociais = vizinhos, amigos, família e redes de contatos (boca a boca)."],
["d","Para Kotler (Marketing 5.0), a tecnologia deve funcionar como…","um copiloto que amplifica a empatia do vendedor humano","um substituto que automatiza todo o atendimento","um painel que só registra o faturamento tardio","um canal exclusivo para clientes corporativos","Copiloto para amplificar empatia, humanização e relacionamento do vendedor."],
["d","O que a IA e o Big Data analisam para personalizar ofertas (Marketing 6.0)?","Micro-momentos, como cliques, tempo de tela e carrinhos abandonados","Somente o faturamento mensal de cada vendedor","Apenas pesquisas de satisfação respondidas pelos clientes","O volume de inserções feitas em mídia impressa","IA e Big Data analisam micro-momentos para exibir ofertas personalizadas na hora."],
["d","O que são clusters, no contexto da estrutura por território?","Conjuntos de elementos muito parecidos, reunidos em um mesmo grupo","Filiais físicas com o mesmo gerente e o mesmo estoque","Regiões geográficas atendidas por um único vendedor","Equipes divididas por especialidade em categorias complexas","Cluster (agrupamento) = elementos com características parecidas, reunidos em um grupo."],
["d","Qual estrutura traz descentralização total, com o vendedor atuando no físico e no digital em tempo real?","Híbrida / Ágil","Por Território Geográfico","Por Linha de Produtos","Por Tipo de Cliente","Híbrida/Ágil elimina barreiras geográficas e a ociosidade da equipe."],
["d","Qual estrutura usa CRM e Big Data para separar jornadas de compra automáticas?","Por Tipo de Cliente","Por Território Geográfico","Por Linha de Produtos","Híbrida / Ágil","Tipo de Cliente: segmenta perfis (ex.: varejo vs. corporativo) com CRM e Big Data."],
["d","No caso Magazine Luiza, qual era o problema da estrutura tradicional por território?","Tempo ocioso em dias fracos e concorrência com o e-commerce da marca","Falta de lojas físicas nas regiões de maior consumo","Ausência total de um aplicativo próprio para os clientes","Alta rotatividade de vendedores por falta de comissão","Vendedores ficavam ociosos com a loja vazia e concorriam com o e-commerce da própria marca."],
["d","Pelo Princípio do Controle (Las Casas), a avaliação da força de vendas compara o real com o planejado e se divide entre…","atividades (esforço) e resultados (saídas)","metas (entradas) e orçamento (saídas)","território (local) e produto (linha)","alcance (topo) e conversão (base)","Padrões claros: atividades medem o esforço; resultados medem as saídas."],
["d","Para o consumidor metamoderno, como o ponto de venda físico deve ser visto?","Um hub de relacionamento e experiência humana","Um depósito regional de produtos para entrega","Um canal concorrente do e-commerce da marca","Um espaço só de retirada de pedidos online","O PDV deixa de ser só um depósito regional e vira hub de relacionamento e experiência."],
["d","Esclarecer dúvidas e mitigar resistências do cliente é qual etapa do processo de vendas?","Superação de Objeções","Apresentação do Produto/Serviço","Pré-abordagem e Abordagem","Fechamento","Superação de Objeções = esclarecer dúvidas e mitigar resistências."],
["d","Qual é a métrica de otimização na viabilidade financeira (Aula 7)?","Cruzar o menor CPM/CPC possível com a maior adequação ao público","Escolher sempre o menor CPM, independentemente do público","Maximizar o alcance total dentro da verba trimestral","Priorizar o canal de maior prestígio, mesmo que custe mais","Otimizar = menor CPM/CPC combinado com a maior taxa de adequação ao público."]
].map(a=>({l:a[0],t:a[1],c:a[2],w:a.slice(3,6),e:a[6]}));
let lv='all',sz=15,R=[],i=0,sc=0,log=[];
const $=document.getElementById('app');
const sh=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const pool=()=>Q.filter(q=>lv=='all'||q.l==lv);
function home(){
 $.innerHTML=`<div class="c"><span class="tag">Comunicação, Mídia e Vendas · Aulas 6 a 9</span><h1>Quiz da Prof.ª Silvana Nery</h1><p class="mut">Banco com ${Q.length} questões. A cada rodada eu sorteio um conjunto novo e embaralho as alternativas.</p>
 <h2>Dificuldade</h2><div class="row">${[['all','Todas'],['f','Fácil'],['m','Médio'],['d','Difícil']].map(([k,n])=>`<button class="${lv==k?'on':''}" onclick="lv='${k}';home()">${n}</button>`).join('')}</div>
 <h2>Questões por rodada</h2><div class="row">${[10,15,20,0].map(n=>`<button class="${sz==n?'on':''}" onclick="sz=${n};home()">${n||'Todas'}</button>`).join('')}</div>
 <p class="mut">${pool().length} questões disponíveis nesse filtro.</p><button class="go" onclick="start()">Começar</button></div>`}
function start(){R=sh(pool());if(sz)R=R.slice(0,sz);R=R.map(q=>({...q,o:sh([q.c,...q.w])}));i=0;sc=0;log=[];show()}
function show(){const q=R[i];
 $.innerHTML=`<div class="c"><div class="bar"><i style="width:${i/R.length*100}%"></i></div><p class="mut">Questão ${i+1} de ${R.length} · <span class="tag">${N[q.l]}</span></p><h2>${q.t}</h2><div>${q.o.map((x,k)=>`<button class="opt" onclick="ans(${k})">${x}</button>`).join('')}</div><div id="f"></div></div>`}
function ans(k){const q=R[i],ok=q.o[k]==q.c;sc+=ok?1:0;log.push({q,ok,p:q.o[k]});
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.o[j]==q.c)b.classList.add('ok');else if(j==k)b.classList.add('no')});
 document.getElementById('f').innerHTML=`<div class="fb"><b>${ok?'Mandou bem! ✅':'Ops, não foi dessa vez ❌'}</b><br>${q.e}</div><p><button class="go" onclick="nxt()">${i+1<R.length?'Próxima':'Ver resultado'}</button></p>`}
function nxt(){i++;i<R.length?show():end()}
function end(){const pc=Math.round(sc/R.length*100),by={};
 log.forEach(x=>{const b=by[x.q.l]=by[x.q.l]||[0,0];b[1]++;b[0]+=x.ok?1:0});
 const bad=log.filter(x=>!x.ok);
 $.innerHTML=`<div class="c"><div class="big">${sc}/${R.length} · ${pc}%</div><p>${pc>=80?'Mandou muito bem!':pc>=60?'Tá no caminho, dá uma olhada nos erros abaixo.':'Vale revisar o conteúdo e tentar de novo.'}</p><div class="row">${Object.keys(by).map(k=>`<span class="tag">${N[k]}: ${by[k][0]}/${by[k][1]}</span>`).join('')}</div><p class="row"><button class="go" onclick="start()">Jogar de novo (novo sorteio)</button><button onclick="home()">Mudar filtro</button></p></div>
 ${bad.length?`<div class="c"><h2>Pra revisar (${bad.length})</h2>${bad.map(x=>`<p><b>${x.q.t}</b><br><span style="color:var(--no)">Você marcou: ${x.p}</span><br><span style="color:var(--ok)">Certa: ${x.q.c}</span><br><span class="mut">${x.q.e}</span></p>`).join('<hr>')}</div>`:'<div class="c"><h2>Gabaritou! 🎉</h2></div>'}`}
home();
</script></body></html>
